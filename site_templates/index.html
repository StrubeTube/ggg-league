<script>
const DATA = /*__DATA__*/{};
const CFG = DATA.cfg;
let TABLE = CFG.table, KCAP = (CFG.kcap === 'off' ? 'off' : 'on'), BMODE = 'budget', LAB = null;
try{
  const L = JSON.parse(localStorage.getItem('ggg-lab-v1'));
  if(L && L.apply === 'on'){
    LAB = L;
    if(L.preset === 'old') TABLE = DATA.steep;
    else if(L.preset === 'custom'){
      const t = (L.flat ?? 30)/100, tb = {};
      for(let r=1;r<=16;r++) tb[r] = Math.max(1, Math.round(DATA.steep[r]*(1-t)+11*t));
      TABLE = tb;
    }
    CFG.table = TABLE;
    if(L.cap) CFG.cap = L.cap;
    if(L.budget) CFG.budget = L.budget;
    if(L.maxk) CFG.maxKeep = L.maxk;
    CFG.franchise = L.fr !== 'off';
    KCAP = L.kcap || 'on';
    BMODE = L.bmode || 'budget';
  }
}catch(e){}
const escal = (r,s)=>{const n=r-s;return n>=1?TABLE[n]:TABLE[1]+6*(1-n);};
DATA.teams.forEach(tm=>tm.players.forEach(p=>{if(p.el){p.k26=escal(p.r,1);p.k27=escal(p.r,2);}}));
const $ = (t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};

/* ---------- state (keeper selections shared with the planner) ---------- */
const LSKEY='ggg-keeper-v1', MYKEY='ggg-my-team';
let kstate={team:0,picks:{}};
try{const s=JSON.parse(localStorage.getItem(LSKEY));if(s&&s.picks)kstate=s;}catch(e){}
const saveK=()=>{try{localStorage.setItem(LSKEY,JSON.stringify(kstate));}catch(e){}};
let myTeam=parseInt(localStorage.getItem(MYKEY) ?? '-1');
const sel=ti=>new Set(kstate.picks[ti]||[]);

function evalTeam(ti){
  const tm=DATA.teams[ti],chosen=sel(ti);
  let keepSpend=0,maxSel=0,franchiseName=null;
  chosen.forEach(pi=>{const p=tm.players[pi];keepSpend+=p.k26;
    if(p.k26>maxSel){maxSel=p.k26;franchiseName=p.n;}});
  const budgetSpend=(CFG.franchise&&chosen.size)?keepSpend-maxSel:keepSpend;
  let next27=0;chosen.forEach(pi=>next27+=tm.players[pi].k27);
  const k=chosen.size,picks=tm.picks.slice();
  picks.splice(Math.max(0,picks.length-k),k);
  const slots=16-k,used=picks.slice(0,slots);
  let draftSpend=0;used.forEach(p=>draftSpend+=TABLE[p.r]);
  const fills=Math.max(0,slots-used.length);
  return {keepSpend,budgetSpend,franchiseName,next27,k,draftSpend,fills,usedPicks:used.length,
          opening:(KCAP==='off'?0:keepSpend)+draftSpend+fills*CFG.waiver,
          overBudget:BMODE==='guaranteed3'?(k>3&&budgetSpend>CFG.budget):budgetSpend>CFG.budget,
          overCount:k>CFG.maxKeep};
}
const capital=ti=>DATA.teams[ti].picks.reduce((a,p)=>a+TABLE[p.r],0);

/* ---------- helpers ---------- */
function card(span,title,chipTxt){
  const c=$('div','dcard c'+span);
  const h=$('div','dcard-head');
  h.appendChild($('h3','cardh',title));
  if(chipTxt)h.appendChild($('span','chip soon',chipTxt));
  c.appendChild(h);
  return c;
}
function skel(card,lines){
  for(let i=0;i<lines;i++){const s=$('div','skel');s.style.width=(88-i*14)+'%';card.appendChild(s);}
}

/* ---------- lab banner ---------- */
if(LAB){
  const b=document.getElementById('labbanner');
  const wrap=$('div','labbanner');
  wrap.appendChild($('span',null,'⚗️ Lab rules active on this device: cap $'+CFG.cap+' · budget $'+CFG.budget+' · '
    +(LAB.preset==='old'?'old steep table':(LAB.preset==='custom'?'custom table':'adopted table'))
    +' · keepers '+(KCAP==='off'?'cap-exempt':'cap-counted')
    +(BMODE==='guaranteed3'?' · 3 keeps guaranteed':'')+(CFG.franchise?'':' · no franchise keep')+' — '));
  const a=document.createElement('a');a.href='lab.html';a.textContent='adjust or turn off in the Lab';
  wrap.appendChild(a);
  b.appendChild(wrap);
}

/* ---------- team picker ---------- */
const bar=document.getElementById('teambar');
DATA.teams.forEach((tm,ti)=>{
  const b=$('button','tpill',tm.name);b.type='button';
  b.addEventListener('click',()=>{myTeam=ti;localStorage.setItem(MYKEY,String(ti));render();});
  bar.appendChild(b);
});

/* ---------- render ---------- */
function render(){
  [...bar.children].forEach((b,i)=>b.classList.toggle('active',i===myTeam));
  renderIdentity();
  renderDash();
}

function renderIdentity(){
  const host=document.getElementById('identity');host.textContent='';
  if(myTeam<0)return;
  const tm=DATA.teams[myTeam],c=DATA.career.find(x=>x.name===tm.name);
  document.getElementById('heroTitle').textContent=tm.name+' HQ';
  const nowName=(c&&c.names.length)?c.names[c.names.length-1].tn:tm.name;
  document.getElementById('heroSub').textContent='Keepers, cap, and what’s next for the 2026 season.';
  if(!c)return;
  const band=$('div','idband');
  const badge=$('div','archbadge');
  badge.appendChild($('div','idname',nowName));
  badge.appendChild($('div','archname','2026'));
  band.appendChild(badge);
  const mid=$('div','idmid');
  const chips=$('div','chiprow');
  [['wk',c.w+'-'+c.l+' all-time'],
   ...(c.titles?[['gold','🏆 ×'+c.titles]]:[]),
   ...(c.toilets?[['fire','🚽 ×'+c.toilets]]:[]),
   ['even','luck '+(c.luck>0?'+':'')+c.luck],
   ['even',(c.pf/(c.w+c.l)).toFixed(1)+' PPG'],
   ['even',c.high_weeks+' weekly highs']].forEach(([cls,txt])=>chips.appendChild($('span','chip '+cls,txt)));
  mid.appendChild(chips);
  band.appendChild(mid);
  host.appendChild(band);
}

function renderDash(){
  const dash=document.getElementById('dash');dash.textContent='';
  if(myTeam<0){
    const c=card(12,'Pick your team above');
    c.appendChild($('p','mut','The dashboard builds itself around your franchise — keepers, cap, grudges, draft capital, and your whole history.'));
    dash.appendChild(c);
    dash.appendChild(capBoardCard(12));
    return;
  }
  const tm=DATA.teams[myTeam],c=DATA.career.find(x=>x.name===tm.name),ev=evalTeam(myTeam);

  /* --- keeper corner (span 7) --- */
  const kc=card(7,'Keeper corner — tap to keep');
  const meters=$('div','kmeters');
  const m1=$('div');
  m1.appendChild($('div','mlabel','Budget $'+ev.budgetSpend+' / $'+CFG.budget+' · '+ev.k+'/'+CFG.maxKeep+' slots'
    +(CFG.franchise&&ev.franchiseName?' · franchise: '+ev.franchiseName:'')+(ev.overCount?' — TOO MANY':'')));
  const met=$('div','meter');const fb=$('div','fillbar'+(ev.overBudget?' over':''));
  fb.style.width=Math.min(100,ev.budgetSpend/CFG.budget*100)+'%';met.appendChild(fb);m1.appendChild(met);
  meters.appendChild(m1);
  const m2=$('div');
  const d=CFG.cap-ev.opening;
  m2.appendChild($('div','mlabel','Opening cap $'+ev.opening+' / $'+CFG.cap+' · '+(d>=0?('$'+d+' headroom'):('$'+(-d)+' over — cap jail'))));
  const met2=$('div','meter');const fb2=$('div','fillbar'+(ev.opening>CFG.cap?' over':''));
  fb2.style.width=Math.min(100,ev.opening/CFG.cap*100)+'%';met2.appendChild(fb2);m2.appendChild(met2);
  meters.appendChild(m2);
  kc.appendChild(meters);
  const list=$('div','roster tallroster');
  tm.players.map((p,pi)=>({p,pi}))
    .filter(x=>x.p.el && x.p.pos!=='DEF')
    .sort((a,b)=>b.p.k26-a.p.k26)
    .forEach(({p,pi})=>{
    const on=sel(myTeam).has(pi);
    const row=$('div','prow'+(on?' on':''));
    row.appendChild($('span','tick',on?'✓':''));
    const nm=$('span','pname',p.n);nm.appendChild($('span','meta',p.pos+(p.t?' · '+p.t:'')));
    row.appendChild(nm);
    row.appendChild($('span','rnd','R'+p.r));
    row.appendChild($('span','cost','$'+p.k26));
    row.appendChild($('span','next','→ $'+p.k27));
    row.tabIndex=0;
    const tog=()=>{const s2=sel(myTeam);s2.has(pi)?s2.delete(pi):s2.add(pi);
      kstate.picks[myTeam]=[...s2];saveK();render();};
    row.addEventListener('click',tog);
    row.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog();}});
    list.appendChild(row);
  });
  kc.appendChild(list);
  dash.appendChild(kc);

  /* --- cap board (span 5) --- */
  dash.appendChild(capBoardCard(5));

  /* --- countdown + vitals (span 3) --- */
  const cd=card(3,'Season countdown');
  const kick=new Date('2026-09-10T20:20:00-04:00');
  const days=Math.max(0,Math.ceil((kick-Date.now())/86400000));
  const bn=$('div','bignum good');bn.appendChild(document.createTextNode(String(days)));
  bn.appendChild($('small',null,' days'));
  cd.appendChild(bn);
  cd.appendChild($('div','subnum','until NFL kickoff · Sep 10, 2026'));
  cd.appendChild($('div','vitals'));
  [['Keeper deadline','2 wks before draft'],['League renewal','waiting on Sleeper'],['Record','— starts wk 1'],['Rank','—']]
    .forEach(([k2,v])=>{const r=$('div','vrow');r.appendChild($('span','mut',k2));r.appendChild($('span',null,v));cd.lastChild.appendChild(r);});
  dash.appendChild(cd);

  /* --- draft capital (span 3) --- */
  const dc=card(3,'2026 draft capital');
  const cap$=capital(myTeam);
  const ranks=DATA.teams.map((_,i)=>capital(i)).sort((a,b)=>b-a);
  const myRank=ranks.indexOf(cap$)+1;
  const bn2=$('div','bignum');bn2.appendChild(document.createTextNode('$'+cap$));
  bn2.appendChild($('small',null,' · #'+myRank+' in league'));
  dc.appendChild(bn2);
  const pcs=$('div','pickchips');
  tm.picks.forEach(p=>{const ch=$('span','pk','R'+p.r);if(p.from)ch.appendChild($('span','frm',' · '+p.from));pcs.appendChild(ch);});
  dc.appendChild(pcs);
  dash.appendChild(dc);

  /* --- matchup center + playoff odds placeholder (span 6) --- */
  const mc=card(6,'Matchup center & playoff odds','LIVE WK 1');
  const mcrow=$('div','mcrow');
  const mcl=$('div','mcl');
  const vs=$('div','vsrow');
  vs.appendChild($('div','vsteam',tm.name));
  vs.appendChild($('div','vsmark','VS'));
  vs.appendChild($('div','vsteam mut','Week 1 opponent'));
  mcl.appendChild(vs);
  skel(mcl,3);
  mcrow.appendChild(mcl);
  const gauge=$('div','gauge');gauge.appendChild($('div','gaugev','—%'));
  mcrow.appendChild(gauge);
  mc.appendChild(mcrow);
  mc.appendChild($('p','cardnote','Live scores, win probability from a Monte Carlo sim of the remaining schedule, your all-time record vs this opponent, and their cap sheet.'));
  dash.appendChild(mc);

  /* ======= everything below is historical → collapsible section ======= */
  const hist=$('div','dash histgrid');

  /* --- season finishes (span 12) --- */
  const tlc=card(12,'Season finishes');
  const tl=$('div','timeline');
  DATA.finishes[tm.name].forEach(f=>{
    const cell=$('div','tcell '+(f.champ?'gold':(f.toilet?'fire':'')));
    cell.appendChild($('div','tyear',f.s));
    cell.appendChild($('div','tplace',f.champ?'🏆':(f.toilet?'🚽':'#'+f.place)));
    tl.appendChild(cell);
  });
  tlc.appendChild(tl);
  hist.appendChild(tlc);

  /* --- manager DNA (span 3) --- */
  const dna=card(3,'Manager DNA');
  [['Trades (career)',c.trades_n],['Waiver/FA adds',c.adds_n],
   ['Trades won / fleeced',c.fleeces+' / '+c.fleeced],
   ['Avg bench pts left',c.avg_bench],
   ['Best win streak','W'+c.streak_w],['Worst skid','L'+c.streak_l]]
    .forEach(([k2,v])=>{const r=$('div','vrow');r.appendChild($('span','mut',k2));r.appendChild($('span',null,String(v)));dna.appendChild(r);});
  hist.appendChild(dna);

  /* --- names history (span 3) --- */
  const nh=card(3,'Names you’ve gone by');
  const seen=new Set();
  [...c.names].reverse().forEach(n=>{
    if(seen.has(n.tn))return;seen.add(n.tn);
    const r=$('div','vrow');r.appendChild($('span','mut',n.s));r.appendChild($('span','tn',n.tn));nh.appendChild(r);
  });
  hist.appendChild(nh);

  /* --- grudges (span 6) --- */
  const g=card(6,'Career grudges');
  const mine=DATA.h2h[tm.name]||{};
  const ent=Object.entries(mine);
  if(ent.length){
    const best=ent.reduce((a,b)=>(b[1].w-b[1].l)>(a[1].w-a[1].l)?b:a);
    const worst=ent.reduce((a,b)=>(b[1].w-b[1].l)<(a[1].w-a[1].l)?b:a);
    const duo=$('div','nemduo');
    const v1=$('div','nemcard good2');
    v1.appendChild($('div','cardh','Your victim'));
    v1.appendChild($('div','nemname',best[0]));
    v1.appendChild($('div','nemrec good',best[1].w+'-'+best[1].l));
    const v2=$('div','nemcard bad2');
    v2.appendChild($('div','cardh','Your nemesis'));
    v2.appendChild($('div','nemname',worst[0]));
    v2.appendChild($('div','nemrec bad',worst[1].w+'-'+worst[1].l));
    duo.appendChild(v1);duo.appendChild(v2);
    g.appendChild(duo);
  }
  const gr=$('div','grudges');
  ent.sort((a,b)=>(b[1].w-b[1].l)-(a[1].w-a[1].l)).forEach(([rival,rec])=>{
    const cls=rec.w>rec.l?'winrec':(rec.w<rec.l?'loserec':'');
    const cell=$('div','gcell');
    cell.appendChild($('div','gname',rival));
    cell.appendChild($('div','grec '+cls,rec.w+'-'+rec.l));
    gr.appendChild(cell);
  });
  g.appendChild(gr);
  hist.appendChild(g);

  /* --- team history dropdown (span 12) --- */
  const det=document.createElement('details');
  det.className='histbox';
  const sum=document.createElement('summary');
  sum.textContent='Team history & all-time stats';
  det.appendChild(sum);
  det.appendChild(hist);
  dash.appendChild(det);
}

let cbFilter='all', cbYear='2026';
function capBoardCard(span){
  const cb=card(span,'League cap board');
  const yr=$('div','filterrow tight');
  [['2026','2026'],['2027','2027 outlook']].forEach(([key,lab])=>{
    const b=$('button','tpill sm'+(cbYear===key?' active':''),lab);b.type='button';
    b.addEventListener('click',()=>{cbYear=key;render();});
    yr.appendChild(b);
  });
  cb.appendChild(yr);

  if(cbYear!=='2026'){
    cb.appendChild($('p','cardnote2','2027 draft capital only — each team’s held 2027 picks priced by the salary table. Keeper costs can’t exist yet; this is the floor each roster starts from.'));
    const rows=DATA.teams.map(tm=>{
      const picks=tm.p27.slice(0,16);
      return {name:tm.name,held:tm.p27.length,val:picks.reduce((a,p)=>a+TABLE[p.r],0),
              acquired:tm.p27.filter(p=>p.from).length};
    }).sort((a,b)=>b.val-a.val);
    rows.forEach(r=>{
      const row=$('div','cbrow');
      const nm=$('div','cbname');
      nm.appendChild($('span','cbteam',r.name));
      nm.appendChild($('span','chip mini',r.held+' picks'));
      row.appendChild(nm);
      const track=$('div','cbtrack');
      const seg=$('div','cbseg d');
      seg.style.left='0';seg.style.width=(Math.min(r.val,250)/250*100)+'%';
      track.appendChild(seg);
      const cap=$('div','cbcap');cap.style.left=(CFG.cap/250*100)+'%';track.appendChild(cap);
      row.appendChild(track);
      const val=$('div','cbval');
      val.appendChild($('b',r.val>CFG.cap?'bad':'','$'+r.val));
      val.appendChild($('span','mut small',r.acquired?(r.acquired+' acquired'):'own picks'));
      row.appendChild(val);
      cb.appendChild(row);
    });
    cb.appendChild($('p','cardnote','Updates automatically as 2027 picks get traded.'));
    return cb;
  }

  const fr=$('div','filterrow tight');
  [['all','Total'],['k','Keepers only'],['d','Draft picks only']].forEach(([key,lab])=>{
    const b=$('button','tpill sm'+(cbFilter===key?' active':''),lab);b.type='button';
    b.addEventListener('click',()=>{cbFilter=key;render();});
    fr.appendChild(b);
  });
  cb.appendChild(fr);
  const notes={all:KCAP==='off'
                 ?'Cap total (keepers are cap-exempt — governed by the budget). Dashed line = $'+CFG.cap+' cap; trades also can’t drop a roster below the $'+(CFG.floor||135)+' floor.'
                 :'Opening cap by source — solid = keepers, faded = draft picks. Dashed line = $'+CFG.cap+' cap; trades can’t leave a roster above it or below the $'+(CFG.floor||135)+' floor.',
               k:'Keeper salary only. Dashed line = $'+CFG.budget+' keeper budget.',
               d:'Draft-round salary only, from the picks each team holds for 2026.'};
  cb.appendChild($('p','cardnote2',notes[cbFilter]));
  const scale=cbFilter==='k'?Math.max(60,CFG.budget+15):250;
  const capLine=cbFilter==='k'?CFG.budget:(cbFilter==='d'?null:CFG.cap);
  const rows=DATA.teams.map((tm,ti)=>{
    const ev=evalTeam(ti);
    const val=cbFilter==='k'?ev.keepSpend:(cbFilter==='d'?ev.draftSpend:ev.opening);
    return {name:tm.name,ti,ev,val};
  }).sort((a,b)=>b.val-a.val);
  rows.forEach(r=>{
    const row=$('div','cbrow');
    const nm=$('div','cbname'+(r.ti===myTeam?' good':''));
    nm.appendChild($('span','cbteam',r.name));
    nm.appendChild($('span','chip mini',r.ev.k+' K'));
    row.appendChild(nm);
    const track=$('div','cbtrack');
    let x=0;
    const segs=cbFilter==='all'?[['k',KCAP==='off'?0:r.ev.keepSpend],['d',r.ev.draftSpend],['f',r.ev.fills*CFG.waiver]]
      :(cbFilter==='k'?[['k',r.ev.keepSpend]]:[['d',r.ev.draftSpend]]);
    segs.forEach(([cls,v])=>{
      if(v<=0)return;
      const seg=$('div','cbseg '+cls);
      seg.style.left=(x/scale*100)+'%';seg.style.width=(Math.min(v,scale-x)/scale*100)+'%';
      track.appendChild(seg);x+=v;
    });
    if(capLine!==null){const cap=$('div','cbcap');cap.style.left=(capLine/scale*100)+'%';track.appendChild(cap);}
    row.appendChild(track);
    const val=$('div','cbval');
    const over=(cbFilter==='k'&&r.val>CFG.budget)||(cbFilter==='all'&&r.val>CFG.cap);
    val.appendChild($('b',over?'bad':'','$'+r.val));
    const sub=cbFilter==='all'
      ?(KCAP==='off'?('keepers $'+r.ev.keepSpend+' exempt'):((r.val?Math.round(r.ev.keepSpend/r.val*100):0)+'% keepers'))
      :(cbFilter==='k'?r.ev.k+' of '+CFG.maxKeep+' slots':r.ev.usedPicks+' picks');
    val.appendChild($('span','mut small',sub));
    row.appendChild(val);
    cb.appendChild(row);
  });
  cb.appendChild($('p','cardnote','Your device’s keeper picks included. Official league-wide keepers appear automatically once set in Sleeper.'));
  return cb;
}


render();

/* live 2026 renewal check */
(async function(){
  try{
    const r=await fetch('https://api.sleeper.app/v1/user/'+DATA.commishUserId+'/leagues/nfl/2026');
    const leagues=await r.json();
    const lg=(leagues||[]).find(l=>l.previous_league_id===DATA.leagueId2025);
    if(!lg)return;
    document.getElementById('heroSub').textContent=lg.name+' is renewed on Sleeper ('+lg.status.replace('_',' ')+') — official keepers sync here once set.';
  }catch(e){}
})();
</script>
